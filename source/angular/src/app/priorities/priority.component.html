<!-- =========================================================
     2. PRIORITIES COMPONENT HTML
     ========================================================= -->
<div class="card shadow-sm border-0">
    <div class="card-header bg-white border-bottom-0 pt-4 pb-2">
        <div class="row align-items-center">
            <div class="col col-md-6">
                <h4 class="card-title text-primary fw-bold mb-0">
                    <i class="fas fa-sort-amount-up me-2"></i>{{ '::Menu:Priorities' | abpLocalization }}
                </h4>
            </div>
            <div class="text-end col col-md-6">
                <button *abpPermission="'ItHelpdesk.Priorities.Create'" id="create"
                    class="btn btn-primary rounded-pill shadow-sm" type="button" (click)="createPriority()">
                    <i class="fa fa-plus me-1"></i>
                    <span>{{ '::NewPriority' | abpLocalization }}</span>
                </button>
            </div>
        </div>
    </div>
    <div class="card-body">
        <ngx-datatable [rows]="priority.items" [count]="priority.totalCount" [list]="list" default
            class="bootstrap rounded">
            <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <div ngbDropdown container="body" class="d-inline-block">
                        <button class="btn btn-light btn-sm border dropdown-toggle" data-toggle="dropdown"
                            aria-haspopup="true" ngbDropdownToggle>
                            <i class="fa fa-cog me-1 text-secondary"></i> {{ '::Actions' | abpLocalization }}
                        </button>
                        <div ngbDropdownMenu class="shadow-sm border-0 mt-1">
                            <button *abpPermission="'ItHelpdesk.Priorities.Edit'" ngbDropdownItem
                                (click)="editPriority(row.id)">
                                <i class="fas fa-edit me-2 text-info"></i>{{ '::Edit' | abpLocalization }}
                            </button>
                            <button *abpPermission="'ItHelpdesk.Priorities.Delete'" ngbDropdownItem
                                (click)="delete(row.id, row.name)">
                                <i class="fas fa-trash-alt me-2 text-danger"></i>{{ '::Delete' | abpLocalization }}
                            </button>
                        </div>
                    </div>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'::PriorityCode' | abpLocalization" prop="code" [width]="200">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <div class="d-flex align-items-center">
                        <div class="avatar-initials shadow-sm">
                            {{ row.code.charAt(0) | uppercase }}
                        </div>
                        <span class="fw-bold text-dark" style="font-size: 14px;">{{ row.code }}</span>
                    </div>
                </ng-template>
            </ngx-datatable-column>

            <ngx-datatable-column [name]="'::PriorityName' | abpLocalization" prop="name"></ngx-datatable-column>

            <ngx-datatable-column [name]="'::Status' | abpLocalization" prop="isActive">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <span class="badge shadow-sm"
                        [ngStyle]="{'background-color': row.isActive ? '#D1FAE5' : '#FEE2E2', 'color': row.isActive ? '#065F46' : '#991B1B', 'padding': '6px 12px', 'border-radius': '20px', 'font-weight': '600', 'font-size': '12px'}">
                        <i class="fas" [ngClass]="row.isActive ? 'fa-circle-check' : 'fa-circle-xmark'"
                            style="font-size: 10px; margin-right: 4px;"></i>
                        {{ (row.isActive ? '::Active' : '::Inactive') | abpLocalization }}
                    </span>
                </ng-template>
            </ngx-datatable-column>
        </ngx-datatable>
    </div>
</div>

<abp-modal [(visible)]="isModalOpen">
    <ng-template #abpHeader>
        <h4 class="modal-title fw-bold text-primary">
            <i class="fas" [ngClass]="selectedPriority.id ? 'fa-edit' : 'fa-plus-circle'"></i>
            {{ (selectedPriority.id ? '::EditPriority' : '::NewPriority') | abpLocalization }}
        </h4>
    </ng-template>
    <ng-template #abpBody>
        <form id="priority-form" [formGroup]="form" (ngSubmit)="save()">
            <div class="form-group mb-3">
                <label for="priority-code" class="form-label fw-bold">{{ '::PriorityCode' | abpLocalization }} <span
                        class="text-danger">*</span></label>
                <input type="text" id="priority-code" class="form-control bg-light" formControlName="code" autofocus />
            </div>
            <div class="form-group mb-3">
                <label for="priority-name" class="form-label fw-bold">{{ '::PriorityName' | abpLocalization }} <span
                        class="text-danger">*</span></label>
                <input type="text" id="priority-name" class="form-control bg-light" formControlName="name" />
            </div>
            <div class="form-group mb-3 ms-1 form-check form-switch">
                <input type="checkbox" id="priority-is-active" class="form-check-input" formControlName="isActive" />
                <label class="form-check-label fw-bold cursor-pointer" for="priority-is-active">{{ '::StatusActive' |
                    abpLocalization }}</label>
            </div>
        </form>
    </ng-template>
    <ng-template #abpFooter>
        <button type="button" class="btn btn-light border" abpClose><i class="fas fa-times me-1"></i>{{ '::Close' |
            abpLocalization }}</button>
        <button form="priority-form" class="btn btn-primary" [disabled]="form.invalid" (click)="save()"><i
                class="fas fa-save me-1"></i>{{ '::Save' | abpLocalization }}</button>
    </ng-template>
</abp-modal>
