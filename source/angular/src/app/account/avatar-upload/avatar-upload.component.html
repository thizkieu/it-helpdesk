<div class="avatar-upload-wrapper d-flex justify-content-center align-items-center min-vh-100 py-5">
    <div class="premium-glass-card shadow-2xl animate-fade-in rounded-4 w-100" style="max-width: 480px;">
      
      <div class="card-header border-bottom px-4 py-4 text-center position-relative">
        <div class="cyber-badge d-inline-flex align-items-center mb-3 px-3 py-2 rounded-pill">
          <i class="fas fa-camera-retro me-2"></i> 
          <span class="fw-bold">{{ 'ItHelpdesk::Avatar:HeaderBadge' | abpLocalization }}</span>
        </div>
        <h4 class="mb-0 text-white fw-bold ls-wide">
          {{ 'ItHelpdesk::Avatar:SettingsTitle' | abpLocalization }}
        </h4>
      </div>
      
      <div class="card-body text-center p-5">
        <div class="avatar-container position-relative d-inline-block mb-4">
            
          <div class="avatar-glow-ring"></div>
            
          <img [src]="currentAvatar" 
               class="rounded-circle avatar-image position-relative z-index-2" 
               (error)="handleImageError()">
          
          <div *ngIf="isUploading" class="upload-overlay rounded-circle position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center z-index-3">
            <div class="spinner-border text-info" role="status"></div>
          </div>
          
          <button *ngIf="!isDefaultAvatar && !isUploading" 
                  class="btn btn-delete-avatar rounded-circle position-absolute z-index-4 d-flex justify-content-center align-items-center"
                  [title]="'ItHelpdesk::Delete' | abpLocalization"
                  (click)="deleteAvatar()" [disabled]="isDeleting">
            <i class="fas" [ngClass]="isDeleting ? 'fa-spinner fa-spin' : 'fa-trash-alt'"></i>
          </button>
        </div>
        
        <div class="mt-2">
          <label class="btn btn-cyber-upload rounded-pill px-4 py-3 fw-semibold cursor-pointer w-100"
                 [class.disabled]="isUploading || isDeleting">
            <span class="upload-icon-wrapper me-2">
                <i class="fas fa-cloud-upload-alt" [class.fa-bounce]="!isUploading && !isDeleting"></i>
            </span>
            <span *ngIf="isUploading">{{ 'ItHelpdesk::Uploading' | abpLocalization }}...</span>
            <span *ngIf="!isUploading">{{ 'ItHelpdesk::Avatar:SelectButton' | abpLocalization }}</span>
            <input type="file" hidden accept="image/jpeg, image/png, image/webp, image/gif" (change)="onFileSelected($event)" [disabled]="isUploading || isDeleting">
          </label>
          
          <div class="support-text mt-4 rounded-3 p-3 text-start d-flex gap-3">
            <i class="fas fa-info-circle text-info fs-5 mt-1"></i>
            <div>
                <p class="mb-1 text-slate-200 fw-medium">{{ 'ItHelpdesk::Avatar:SupportText' | abpLocalization }}</p>
                <small class="text-slate-400">{{ 'ItHelpdesk::Avatar:SupportFormatText' | abpLocalization }}</small>
            </div>
          </div>
        </div>
      </div>
    </div>
</div>
