<div class="ticket-page-wrapper py-4" *ngIf="!isLoading">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="badge cute-badge-pill mb-2"><i class="fas fa-book me-1"></i> Help Center</span>
                <h2 class="fw-bold page-title mb-0 text-white">Cẩm nang hướng dẫn (Knowledge Base)</h2>
            </div>
            <div>
                <a routerLink="/tickets/it-queue" class="btn cute-outline-btn rounded-pill px-4 text-pink border-pink">
                    <i class="fas fa-ticket-alt me-1"></i> Trở về hàng đợi
                </a>
            </div>
        </div>

        <div class="card premium-glass-card border-0 shadow-lg mb-4 p-4 position-relative search-wrapper"
            style="z-index: 999;">
            <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 border-secondary text-pink ps-3">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" class="form-control premium-input text-white border-start-0 ps-2 shadow-none"
                    [(ngModel)]="searchText" (input)="onSearchInput()" (keyup.enter)="performSearch()"
                    (focus)="showSearchSuggestions = true"
                    placeholder="Bạn cần tìm hướng dẫn về vấn đề gì (vd: đổi mật khẩu, lỗi máy in, VPN...)?">

                <button *ngIf="searchText"
                    class="btn btn-link text-muted position-absolute end-0 top-50 translate-middle-y p-0 me-4"
                    type="button" style="z-index: 10;" (click)="clearSearch()" title="Xóa">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- FIX LỖI UI: Bổ sung top:100% và z-index:1050 -->
            <ul *ngIf="showSearchSuggestions && recentSearches.length > 0"
                class="dropdown-menu show w-100 shadow-lg border-0 mt-2 p-2 rounded-4 position-absolute text-start"
                style="background: rgba(22, 22, 35, 0.95); backdrop-filter: blur(12px); top: 100%; z-index: 1050; border: 1px solid rgba(255,255,255,0.1) !important; left: 0; right: 0; width: calc(100% - 3rem) !important; margin-left: 1.5rem;">

                <li class="d-flex justify-content-between align-items-center px-3 py-1 mb-1">
                    <span class="text-pink small fw-bold">
                        <i class="fas fa-history me-1"></i> Lịch sử tìm kiếm gần đây
                    </span>
                    <button class="btn btn-link text-muted p-0 small text-decoration-none" style="font-size: 0.75rem;"
                        (click)="clearAllSearchHistory($event)">
                        Xóa tất cả
                    </button>
                </li>

                <li *ngFor="let item of recentSearches" (click)="selectSearchSuggestion(item)"
                    class="dropdown-item text-light rounded-3 cursor-pointer px-3 py-2 my-1 d-flex justify-content-between align-items-center custom-dropdown-item">
                    <div>
                        <i class="fas fa-search text-purple-accent me-2 opacity-75"></i> <span>{{ item }}</span>
                    </div>
                    <i class="fas fa-times text-muted hover-pink ms-2 p-1" title="Xóa mục này"
                        (click)="removeSearchHistoryItem(item, $event)"></i>
                </li>
            </ul>
        </div>

        <div class="row g-4" *ngIf="filteredFaqList.length > 0">
            <div class="col-md-6" *ngFor="let item of filteredFaqList">
                <div class="card premium-glass-card border-0 shadow-lg p-4 h-100">
                    <div class="d-flex align-items-start mb-3">
                        <div class="avatar bg-purple-soft bg-opacity-25 text-purple-accent rounded-circle d-flex justify-content-center align-items-center me-3 flex-shrink-0"
                            style="width: 40px; height: 40px;">
                            <i class="fas fa-question"></i>
                        </div>
                        <div>
                            <span class="badge bg-secondary bg-opacity-25 text-info mb-1" *ngIf="item.category">{{
                                item.category }}</span>
                            <h5 class="fw-bold text-white mb-0">{{ item.question }}</h5>
                        </div>
                    </div>
                    <p class="text-light opacity-75 mb-0 ps-5" style="line-height: 1.6;">
                        {{ item.answer }}
                    </p>
                </div>
            </div>
        </div>

        <div class="text-center py-5" *ngIf="filteredFaqList.length === 0">
            <i class="fas fa-search fa-3x mb-3 text-secondary opacity-50"></i>
            <p class="text-light opacity-50 mb-0">Không tìm thấy hướng dẫn phù hợp với từ khóa của bạn.</p>
        </div>
    </div>
</div>

<div class="text-center py-5 min-vh-100 d-flex justify-content-center align-items-center" *ngIf="isLoading">
    <div class="spinner-border text-pink" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>
